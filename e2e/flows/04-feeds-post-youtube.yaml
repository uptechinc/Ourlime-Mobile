appId: com.ourlime.app
---
- launchApp

# 1. Tap Create Post
- tapOn: "Create a Post"
- assertVisible: "What's on your mind?"

# 2. Type Post with YouTube link
- tapOn: "What's on your mind?"
- inputText: "Check out this great soca video: https://www.youtube.com/watch?v=dQw4w9WgXcQ"
- hideKeyboard

# 3. Publish Post
- tapOn: "Post"

# 4. Verify post appears on feed with YouTube embed & clickable link
- assertVisible: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
- assertVisible: "Watch on YouTube / Open App"
