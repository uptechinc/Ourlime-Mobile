appId: com.ourlime.app
---
- launchApp

# 1. Open Navigation Drawer
- tapOn:
    id: "header-menu-button"
    optional: true
- assertVisible: "Explore"

# 2. Verify all social surfaces are present
- assertVisible: "Communities"
- assertVisible: "Events"
- assertVisible: "Jobs"
- assertVisible: "Market"
- assertVisible: "Blogs"
- assertVisible: "E-Learning"
- assertVisible: "E-Projects"
- assertVisible: "Ads"
- assertVisible: "E-Wallet"
- assertVisible: "E-Hub"

# 3. Verify standalone games are NOT in the drawer
- assertNotVisible: "Games"
- assertNotVisible: "Wordle Game"
- assertNotVisible: "Trini GeoGuesser"

# 4. Open Settings
- tapOn: "Settings"
- assertVisible: "Appearance"
- back
