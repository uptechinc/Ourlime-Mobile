appId: com.ourlime.app
---
- launchApp

# 1. Assert filter options are visible on Home Feed
- assertVisible: "All"
- assertVisible: "Photos"
- assertVisible: "Videos"
- assertVisible: "Sound"

# 2. Test Photos filter
- tapOn: "Photos"

# 3. Test Videos filter
- tapOn: "Videos"

# 4. Test Sound filter (Coming Soon badge)
- tapOn: "Sound"
- assertVisible:
    text: ".*(Soon|Sound).*"

# 5. Return to All filter & scroll feed
- tapOn: "All"
- scroll
- scroll
