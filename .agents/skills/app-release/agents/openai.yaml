interface:
  display_name: "App Release: Detailed Release Notes"
  short_description: "Ship production Play or OTA updates with bulleted release notes covering everything since the last release"
  default_prompt: "Use $app-release: diff against the last published release, add the release at the top of lib/releaseHistory.json and run npm run release:check, pick a Play release (local production .aab) or OTA, prepare Play Console, and hand the publish and announce steps to the user."
